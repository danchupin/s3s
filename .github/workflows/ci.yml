name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: golangci-lint
        # v8 installs golangci-lint v2 (our .golangci.yml is config version 2).
        # "latest" is built with a current Go toolchain — it must be >= go.mod's
        # version or the linter refuses to run.
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Not gofmt-ed:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Read-only guard
        run: make check-readonly

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Integration tests (real MinIO via testcontainers)
        run: go test -tags=integration ./internal/storage/...

      - name: Build
        run: go build ./...
